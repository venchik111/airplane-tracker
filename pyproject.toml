[tool.poetry]
name = "airplane-tracker"
version = "0.1.0"
description = "Консольный трекер самолётов"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
black = ">=25,<27"
isort = ">=6,<8"
flake8 = ">=7,<8"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70"

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
relative_files = true
